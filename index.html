<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Git Practice Session</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            margin-top: 100px;
        }

        .card {
            width: 400px;
            margin: auto;
            padding: 30px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #333;
        }

        h2 {
            color: #555;
            line-height: 1.6;
        }

        .usn {
            color: #0077cc;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background-color: #333;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;   
        }
    </style>
</head>

<body>
   
    <div class="card">
        <h1>Welcome</h1>
        <h2 class="usn">User123</h2>
        <button>Click Me</button>
    </div>
</body>

</html>
